<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">COBOT Magic main-view camera mounting schematic</title>
  <desc id="desc">Front and side views show the factory aluminum-extrusion camera mount retained between two follower arms. Only the main-view camera height and angle are adjusted: 177.2 centimeters above the floor and 27.5 degrees to the vertical extrusion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d65f24"/>
    </marker>
    <style>
      .panel { fill: #f7f9fb; stroke: #c9d2dc; stroke-width: 2; }
      .frame { fill: #778492; stroke: #35414d; stroke-width: 2; }
      .robot { fill: none; stroke: #4a5967; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .joint { fill: #f7f9fb; stroke: #4a5967; stroke-width: 4; }
      .camera { fill: #2f9d73; stroke: #176044; stroke-width: 3; }
      .lens { fill: #15242e; stroke: #e6edf3; stroke-width: 2; }
      .bracket { fill: none; stroke: #343d45; stroke-width: 12; stroke-linecap: round; }
      .centerline { fill: none; stroke: #8e9aa5; stroke-width: 2; stroke-dasharray: 5 7; }
      .reference { fill: none; stroke: #d65f24; stroke-width: 3; }
      .dimension { fill: none; stroke: #d65f24; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .floor { stroke: #263440; stroke-width: 5; }
      .worktop { fill: #d8c8ab; stroke: #75654c; stroke-width: 3; }
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2d38; font-size: 17px; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #53616d; }
      .measure { font-size: 20px; font-weight: 700; fill: #b34f14; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="510" height="570" rx="12"/>
  <rect class="panel" x="570" y="20" width="510" height="570" rx="12"/>
  <text class="heading" x="48" y="60">Front view</text>
  <text class="heading" x="598" y="60">Side view</text>

  <!-- Front view: the vertical extrusion is centered between the arms. -->
  <line class="floor" x1="50" y1="536" x2="500" y2="536"/>
  <rect class="worktop" x="92" y="395" width="366" height="22" rx="3"/>
  <rect class="frame" x="261" y="100" width="30" height="436" rx="3"/>
  <line class="centerline" x1="276" y1="82" x2="276" y2="536"/>

  <path class="robot" d="M 105 505 L 123 446 L 157 368 L 210 304 L 231 350"/>
  <circle class="joint" cx="123" cy="446" r="12"/>
  <circle class="joint" cx="157" cy="368" r="12"/>
  <circle class="joint" cx="210" cy="304" r="12"/>
  <rect class="camera" x="216" y="338" width="34" height="27" rx="5"/>
  <circle class="lens" cx="241" cy="352" r="6"/>

  <path class="robot" d="M 447 505 L 429 446 L 395 368 L 342 304 L 321 350"/>
  <circle class="joint" cx="429" cy="446" r="12"/>
  <circle class="joint" cx="395" cy="368" r="12"/>
  <circle class="joint" cx="342" cy="304" r="12"/>
  <rect class="camera" x="302" y="338" width="34" height="27" rx="5"/>
  <circle class="lens" cx="311" cy="352" r="6"/>

  <rect class="camera" x="245" y="163" width="62" height="45" rx="8"/>
  <circle class="lens" cx="276" cy="186" r="10"/>
  <text class="label" x="318" y="179">Main-view camera</text>
  <text class="small" x="318" y="199">Factory extrusion retained</text>
  <text class="small" x="74" y="566">Finished floor</text>

  <!-- Side view: angle is measured from the vertical extrusion. -->
  <line class="floor" x1="598" y1="536" x2="1050" y2="536"/>
  <rect class="worktop" x="754" y="395" width="270" height="22" rx="3"/>
  <rect class="frame" x="914" y="92" width="34" height="444" rx="3"/>

  <path class="bracket" d="M 914 174 L 883 232"/>
  <g transform="translate(914 174) rotate(-62.5)">
    <rect class="camera" x="-106" y="-24" width="82" height="48" rx="8"/>
    <circle class="lens" cx="-88" cy="0" r="10"/>
  </g>

  <path class="reference" d="M 914 174 V 266"/>
  <path class="reference" d="M 914 174 L 872 255"/>
  <path class="reference" d="M 914 230 A 56 56 0 0 1 888 224"/>
  <text class="measure" x="827" y="216">27.5°</text>
  <text class="small" x="777" y="238">to vertical extrusion</text>

  <path class="reference" d="M 673 252 H 880"/>
  <path class="reference" d="M 673 536 H 914"/>
  <path class="dimension" d="M 673 252 V 536"/>
  <text class="measure" x="650" y="442" transform="rotate(-90 650 442)">177.2 cm above floor</text>

  <text class="label" x="734" y="302">Main-view camera</text>
  <text class="small" x="598" y="566">Finished floor</text>
  <text class="small" x="909" y="566">Not to scale</text>
</svg>
